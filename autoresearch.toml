# Paths are relative to this file. Keep this config fixed after `plan`/`run`.
# Change output to start a new experiment with different settings.
[research]
contract = "hackathon.toml"
output = "runs/autoresearch-sdk"
optimizer_model = "gpt-6-astra"
reasoning_effort = "high"
max_output_tokens = 40000
generations = 10                  # proposal rounds PER agent; 0 = until a limit
candidates_per_domain = 5        # maximum submissions per SDK research round
max_inflight_candidates_per_domain = 5  # refill as individual results arrive
keep_top = 3
max_parallel_suites = 5          # use 10 on a larger machine / after observing load
tasks_per_suite = 2
max_task_containers = 10         # global cap, shared by ALL suites and both domains
repeats = 1                     # use 2–3 in a NEW experiment to reduce sampling noise
seed = 42
min_improvement = 0.001
max_evaluations = 120            # includes controls, seeds, retries, and final holdout
max_optimizer_calls = 240       # all SDK model steps and HTTP retries
suite_timeout_seconds = 14400
max_hours = 12                   # persistent wall-clock deadline from the first run
feedback_examples = 6
max_skill_chars = 24000

[domains.health]
skill = "submissions/aditya-tim/health"
# Preserve the existing manually selected local development/validation partition.
dev_file = "research/splits/health-dev.txt"
holdout_file = "research/splits/health-holdout.txt"

[domains.hle]
skill = "submissions/aditya-tim/hle"
dev_size = 24
holdout_size = 24
